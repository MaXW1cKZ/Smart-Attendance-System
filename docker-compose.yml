version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart_attendance_db
    restart: always
    environment:
      - TZ=Asia/Bangkok
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "5433:5432"
    networks:
      - app_network

  backend:
    environment:
      - TZ=Asia/Bangkok
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    build:
      context: ./backend
    container_name: smart_attendance_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_API_URL=/api
    container_name: smart_attendance_frontend
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: smart_attendance_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
