# ส่วนที่ 1: บังคับเปลี่ยนจาก http เป็น https
server {
    listen 80;
    server_name smartcheck.it.kmitl.ac.th 10.72.0.167;
    return 301 https://$host$request_uri;
}

# ส่วนที่ 2: คอนฟิกหลักสำหรับระบบเช็คชื่อ
server {
    listen 443 ssl;
    server_name smartcheck.it.kmitl.ac.th 10.72.0.167;

    # ตำแหน่งไฟล์ SSL
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # เพิ่มขนาดการรับข้อมูลสำหรับรูปภาพใบหน้า (Face Registration)
    client_max_body_size 10M;

    # จัดการส่วน API (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # เพิ่ม Timeout เป็น 5 นาที สำหรับการประมวลผล AI ที่อาจใช้เวลานาน
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # จัดการส่วนหน้าเว็บ (React/Frontend)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}